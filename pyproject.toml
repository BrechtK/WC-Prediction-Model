[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wc-predictor"
version = "0.1.0"
description = "Market-implied World Cup prediction-pool optimiser"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: fast isolated tests",
    "integration: multi-module workflow tests",
    "slow: slower tests that are safe to skip during quick local iterations",
    "backtest: historical backtest workflow tests",
    "optimisation: numerical optimisation tests",
]
